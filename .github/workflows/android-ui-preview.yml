name: Nemo Android UI Preview

on:
  push:
    branches: [ui-testing]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-apk:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android

      - name: Setup Android SDK
        run: |
          echo "ANDROID_HOME=/usr/local/lib/android/sdk" >> $GITHUB_ENV
          ls /usr/local/lib/android/sdk/ndk || true
          # Install NDK if not present
          SDK=/usr/local/lib/android/sdk
          echo "ANDROID_HOME=$SDK" >> $GITHUB_ENV
          SDKMANAGER=$(find $SDK -name sdkmanager -type f | head -1)
          if [ ! -d $SDK/ndk/27.2.12479018 ]; then
            yes | $SDKMANAGER "ndk;27.2.12479018" || true
          fi
          NDK=$(ls -d /usr/local/lib/android/sdk/ndk/* | sort -V | tail -1)
          echo "ANDROID_NDK_ROOT=$NDK" >> $GITHUB_ENV
          echo "Using NDK: $NDK"

      - name: Install cargo-apk
        run: cargo install cargo-apk --locked

      - name: Decode signing keystore
        env:
          NEMO_KEYSTORE_BASE64: ${{ secrets.NEMO_KEYSTORE_BASE64 }}
        run: |
          echo "$NEMO_KEYSTORE_BASE64" | base64 -d > /tmp/nemo-test.keystore

      - name: Compute build version
        id: ver
        run: |
          RUN=${{ github.run_number }}
          MINOR=$(( (RUN / 256) % 256 ))
          PATCH=$(( RUN % 256 ))
          echo "version=0.${MINOR}.${PATCH}" >> $GITHUB_OUTPUT
          echo "build=$RUN" >> $GITHUB_OUTPUT
          echo "version_code=$RUN" >> $GITHUB_OUTPUT

      - name: Bump version in Cargo.toml
        run: |
          sed -i 's/^version = ".*"/version = "${{ steps.ver.outputs.version }}"/' apps/mobile/Cargo.toml
          grep '^version' apps/mobile/Cargo.toml

      - name: Build APK
        env:
          ANDROID_HOME: ${{ env.ANDROID_HOME }}
          ANDROID_NDK_ROOT: ${{ env.ANDROID_NDK_ROOT }}
          JAVA_HOME: ${{ env.JAVA_HOME }}
          CARGO_APK_DEV_KEYSTORE: /tmp/nemo-test.keystore
          CARGO_APK_DEV_KEYSTORE_PASSWORD: ${{ secrets.NEMO_KEYSTORE_PASSWORD }}
          BUILD_NUMBER: ${{ steps.ver.outputs.build }}
        run: |
          cd apps/mobile
          cargo apk build --target aarch64-linux-android --lib

      - name: Locate APK
        id: apk
        run: |
          APK=$(find . -name "nook_mobile.apk" -o -name "nemo_mobile.apk" | head -1)
          if [ -z "$APK" ]; then APK=$(find . -path "*apk/*.apk" -name "*.apk" ! -name "*unaligned*" | head -1); fi
          echo "path=$APK" >> $GITHUB_OUTPUT
          echo "APK: $APK"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: nemo-ui-preview-${{ steps.ver.outputs.build }}
          path: ${{ steps.apk.outputs.path }}

      - name: Create prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ui-preview-${{ steps.ver.outputs.build }}
          name: "Nemo UI Preview — Build #${{ steps.ver.outputs.build }}"
          prerelease: true
          generate_release_notes: true
          files: ${{ steps.apk.outputs.path }}
          body: |
            Nemo UI Preview Build

            Version: ${{ steps.ver.outputs.version }}
            Build: #${{ steps.ver.outputs.build }}
            Commit: ${{ github.sha }}

            UI PREVIEW BUILD
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
