services:
  postgres:
    image: postgres:17
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: ""
      POSTGRES_HOST_AUTH_METHOD: trust
      POSTGRES_DB: nook
    ports:
      - "5432:5432"
    volumes:
      - nook_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d nook"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  nook_pgdata:
