  border: 1px solid var(--nemo-line-strong);
  border-radius: 15px;
  background: var(--nemo-surface);
  color: var(--nemo-text);
  box-shadow: var(--nemo-inner-highlight), var(--nemo-shadow-soft);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  touch-action: manipulation;
  transition: transform var(--nemo-tap) var(--nemo-ease-out);
}

.nemo-theme-toggle:active { transform: scale(0.94); }
.nemo-theme-toggle svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.nemo-theme-toggle .nemo-icon-sun { display: none; }
[data-theme="dark"] .nemo-theme-toggle .nemo-icon-sun { display: block; }
[data-theme="dark"] .nemo-theme-toggle .nemo-icon-moon { display: none; }

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
<!-- NEMO-TOKENS:END -->
</head>
<body>
<div class="ambient" aria-hidden="true"></div>
<div class="app">
  <header class="topbar">
    <div class="brand"><div class="brand-mark" aria-hidden="true">N</div><span>Nemo</span></div>
    <button class="icon-btn" id="themeToggle" aria-label="Switch to dark mode" title="Switch theme">
      <svg id="themeIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M20.5 15.2A8.7 8.7 0 0 1 8.8 3.5 8.7 8.7 0 1 0 20.5 15.2Z"/></svg>
    </button>
  </header>
  <main class="main">
    <div class="eyebrow"><span class="eyebrow-dot"></span> YOUR SPACE, YOUR PEOPLE</div>
    <h1 class="heading">Welcome<br>back.</h1>
    <p class="subheading">Sign in to pick up where your conversations left off.</p>
    <form class="form-card" id="loginForm" novalidate>
      <label class="field">
        <span class="field-label">Username</span>
        <span class="input-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.5-3.5 3-5.5 7-5.5s6.5 2 7 5.5"/></svg>
          <input id="username" name="username" type="text" placeholder="Enter your username" autocomplete="username" autocapitalize="none" spellcheck="false" required>
        </span>
      </label>
      <label class="field">
        <span class="field-label">Password</span>
        <span class="input-wrap">
          <svg class="field-icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="4.5" y="10" width="15" height="10" rx="2.3"/><path d="M8 10V7.2a4 4 0 0 1 8 0V10"/></svg>
          <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button class="reveal" id="togglePassword" type="button" aria-label="Show password">
            <svg id="eyeIcon" viewBox="0 0 24 24" aria-hidden="true"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/></svg>
          </button>
        </span>
      </label>
      <div class="form-meta">
        <label class="remember"><input type="checkbox" id="remember"><span>Remember me</span></label>
        <button class="text-link" id="forgotBtn" type="button">Forgot password?</button>
      </div>
      <button class="primary" id="signInBtn" type="submit">Sign in <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4.5 12h14m-6-6 6 6-6 6"/></svg></button>
      <div class="divider">OR</div>
      <div class="recovery-row"><span>Have a recovery code?</span><button class="text-link" id="recoveryBtn" type="button">Recover account</button></div>
    </form>
    <div class="bottom">New to Nemo?<a href="#signup" id="signupLink">Create an account</a></div>
    <div class="footnote"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 19 6v5c0 4.5-2.8 8-7 10-4.2-2-7-5.5-7-10V6l7-3Z"/><path d="m9 12 2 2 4-4"/></svg><span>Private account access · Sign in securely</span></div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
(()=>{
 const root=document.documentElement,themeBtn=document.getElementById('themeToggle'),themeIcon=document.getElementById('themeIcon'),toast=document.getElementById('toast');let toastTimer;
 function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2300)}
 function setTheme(theme){root.dataset.theme=theme;const dark=theme==='dark';themeBtn.setAttribute('aria-label',dark?'Switch to light mode':'Switch to dark mode');themeIcon.innerHTML=dark?'<circle cx="12" cy="12" r="3.5"/><path d="M12 2v2m0 16v2M4.9 4.9l1.4 1.4m11.4 11.4 1.4 1.4M2 12h2m16 0h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/>':'<path d="M20.5 15.2A8.7 8.7 0 0 1 8.8 3.5 8.7 8.7 0 1 0 20.5 15.2Z"/>';document.querySelector('meta[name="theme-color"]').content=dark?'#101010':'#f1f1f1'}
 themeBtn.addEventListener('click',()=>setTheme(root.dataset.theme==='light'?'dark':'light'));
 const password=document.getElementById('password'),togglePassword=document.getElementById('togglePassword');togglePassword.addEventListener('click',()=>{const show=password.type==='password';password.type=show?'text':'password';togglePassword.setAttribute('aria-label',show?'Hide password':'Show password');document.getElementById('eyeIcon').innerHTML=show?'<path d="m3 3 18 18"/><path d="M10.6 10.6a2 2 0 0 0 2.8 2.8"/><path d="M9.9 5.2A10.6 10.6 0 0 1 12 5c6.2 0 9.5 7 9.5 7a15 15 0 0 1-3.1 3.8M6.2 6.2C3.8 7.8 2.5 12 2.5 12s3.3 7 9.5 7c1.2 0 2.3-.2 3.3-.7"/>':'<path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.5"/>';});
 document.getElementById('loginForm').addEventListener('submit',e=>{e.preventDefault();const u=document.getElementById('username').value.trim(),p=password.value;if(!u||!p){showToast('Enter your username and password to continue.');(!u?document.getElementById('username'):password).focus();return}showToast('Preview only — connect sign-in to Nemo authentication.');});
 document.getElementById('forgotBtn').addEventListener('click',()=>showToast('Open the Recovery (codes) screen.'));
 document.getElementById('recoveryBtn').addEventListener('click',()=>showToast('Open account recovery using your recovery code.'));
 document.getElementById('signupLink').addEventListener('click',e=>{e.preventDefault();showToast('Open the Sign up screen.');});
 // Touch-only ripple feedback; no mousemove or hover tracking.
 document.querySelectorAll('.primary,.icon-btn,.reveal').forEach(el=>el.addEventListener('pointerdown',e=>{if(e.pointerType==='mouse')return;const r=el.getBoundingClientRect(),size=Math.max(r.width,r.height)*1.35,span=document.createElement('span');span.className='ripple';span.style.width=span.style.height=size+'px';span.style.left=(e.clientX-r.left-size/2)+'px';span.style.top=(e.clientY-r.top-size/2)+'px';el.appendChild(span);span.addEventListener('animationend',()=>span.remove(),{once:true})}));
})();
</script>
</body>
</html>
