    --line-strong: rgba(255,255,255,.16);

  [data-theme="dark"] .ambient.two { background:radial-gradient(circle at 55% 40%, rgba(255,255,255,.14), rgba(150,150,150,.1) 37%, transparent 72%); }
  .grain {
    position:absolute;inset:0;z-index:-1;pointer-events:none;opacity:.13;
    background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 180 180' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.82' numOctaves='3' stitchTiles='stitch'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='.16'/%3E%3C/svg%3E");

  .eyebrow {

    line-height:1.045;letter-spacing:-.067em;font-weight:690;
  }
  .intro-copy { margin:14px 0 0;max-width:310px;color:var(--muted);font-size:14px;line-height:1.65;letter-spacing:-.015em; }

    position:relative;border-radius:30px;padding:1px;

    background:linear-gradient(145deg,var(--paper-strong),var(--paper) 56%,rgba(230,230,227,.52));
    backdrop-filter:blur(26px) saturate(112%);-webkit-backdrop-filter:blur(26px) saturate(112%);
    isolation:isolate;
  }
  [data-theme="dark"] .glass-card { background:linear-gradient(145deg,rgba(47,47,47,.92),rgba(31,31,31,.78) 56%,rgba(45,45,45,.8)); }
  /* Touch-only feedback: a brief light bloom where the finger touches the glass. */

  }
  [data-theme="dark"] .glass-card.touch-lit::before {

  }
  .touch-ripple {
    position:absolute;z-index:2;pointer-events:none;border-radius:50%;

    background:radial-gradient(circle,rgba(255,255,255,.30),rgba(255,255,255,.10) 48%,transparent 72%);
    border:1px solid rgba(255,255,255,.32);

  .glass-card::before {

    background:linear-gradient(125deg,rgba(255,255,255,.58),transparent 24%,transparent 66%,rgba(255,255,255,.10));

  .card-heading { margin-bottom:23px; }
  .card-heading h2 {margin:0;font-size:21px;line-height:1.2;letter-spacing:-.045em;font-weight:670;}
  .card-heading p {margin:7px 0 0;color:var(--muted);font-size:12.5px;line-height:1.5;}
  .field {display:block;margin:0 0 16px;}
  .field-label {display:block;margin:0 0 8px 2px;font-size:11px;font-weight:650;color:var(--ink-2);letter-spacing:.015em;}
  .input-wrap {position:relative;}
  .field input {
    width:100%;height:53px;border:1px solid var(--line);outline:none;border-radius:15px;
    padding:0 47px 0 15px;background:var(--field);color:var(--ink);
    font-size:14px;letter-spacing:-.01em;

  .field input:focus-visible {outline:none;}
  .input-icon {position:absolute;right:14px;top:50%;transform:translateY(-50%);width:17px;height:17px;color:var(--muted-2);pointer-events:none;}
  .password-toggle {position:absolute;right:10px;top:50%;transform:translateY(-50%);width:32px;height:32px;border:0;background:transparent;color:var(--muted);display:grid;place-items:center;cursor:pointer;border-radius:9px;}
  .password-toggle:active {background:var(--line);}
  .password-toggle svg {width:17px;height:17px;}
  .form-meta {display:flex;align-items:center;justify-content:space-between;gap:10px;margin:3px 1px 21px;}

  .remember input {appearance:none;width:15px;height:15px;margin:0;border-radius:4px;border:1px solid var(--muted-2);background:var(--paper-strong);display:grid;place-items:center;}

  .remember input:checked::after {content:"✓";font-size:10px;color:var(--bg);line-height:1;}
  .text-button {border:0;background:none;padding:5px 0;color:var(--ink-2);font-size:11px;font-weight:650;cursor:pointer;}

  --nemo-line: rgba(255, 255, 255, 0.09);
  --nemo-line-strong: rgba(255, 255, 255, 0.15);

  --nemo-text: #f2f2f0;
  --nemo-text-2: #a8a8a4;
  --nemo-text-3: #777774;

  --nemo-primary: #f1f1ef;
  --nemo-on-primary: #171717;
  --nemo-track: rgba(255, 255, 255, 0.12);
  --nemo-nav: rgba(26, 26, 26, 0.84);
  --nemo-scrim: rgba(0, 0, 0, 0.58);
  --nemo-danger: #c8c8c4;
  --nemo-danger-soft: rgba(255, 255, 255, 0.07);

  --nemo-shadow: 0 20px 48px rgba(0, 0, 0, 0.36), 0 3px 12px rgba(0, 0, 0, 0.20);
  --nemo-shadow-soft: 0 8px 24px rgba(0, 0, 0, 0.26);
  --nemo-shadow-nav: 0 16px 44px rgba(0, 0, 0, 0.44), inset 0 1px 0 rgba(255, 255, 255, 0.10);
  --nemo-inner-highlight: inset 0 1px 0 rgba(255, 255, 255, 0.10);
}

/* --------------------------------------------------------------------------
   Compatibility aliases used by earlier references.
   Declared after both theme blocks, and matched against every theme host, so
   these canonical mappings win over each reference's local palette in light
   AND dark. They only ever point at canonical Nemo tokens.
   -------------------------------------------------------------------------- */
:root,
html[data-theme="dark"],
[data-theme="dark"],
body[data-theme="dark"] {
  --bg: var(--nemo-bg);
  --bg2: var(--nemo-bg-2);
  --surface: var(--nemo-surface);
  --surface-strong: var(--nemo-surface-strong);
  --surface-soft: var(--nemo-surface-soft);
  --line: var(--nemo-line);
  --line-strong: var(--nemo-line-strong);
  --text: var(--nemo-text);
  --muted: var(--nemo-text-2);
  --subtle: var(--nemo-text-3);
  --solid: var(--nemo-primary);
  --solid-text: var(--nemo-on-primary);
  --nav: var(--nemo-nav);
  --track: var(--nemo-track);
  --danger: var(--nemo-danger);
  --glass-blur: var(--nemo-blur);
  --shadow: var(--nemo-shadow);
  --shadow-soft: var(--nemo-shadow-soft);

  --ink: var(--nemo-text);
  --ink-2: var(--nemo-text-2);
  --ink-soft: var(--nemo-text-2);
  --text-2: var(--nemo-text-2);
  --muted2: var(--nemo-text-3);
  --muted-2: var(--nemo-text-3);
  --subtle-2: var(--nemo-text-3);
  --line-soft: var(--nemo-line);
  --glass: var(--nemo-surface);
  --glass2: var(--nemo-surface-strong);
  --glass-hi: var(--nemo-glass-edge);
  --glass-edge: var(--nemo-glass-edge);
  --glass-strong: var(--nemo-surface-strong);
  --glass-low: var(--nemo-surface-soft);
  --panel: var(--nemo-surface);
  --panel-strong: var(--nemo-surface-strong);
  --field: var(--nemo-surface-soft);
  --field-focus: var(--nemo-surface-strong);
  --input: var(--nemo-surface-soft);
  --bubble: var(--nemo-surface-soft);
  --soft: var(--nemo-surface-soft);
  --chip: var(--nemo-surface-soft);
  --chip-active: var(--nemo-primary);
  --chip-active-text: var(--nemo-on-primary);
  --pill: var(--nemo-surface-soft);
  --tab: var(--nemo-track);
  --button: var(--nemo-primary);
  --button-text: var(--nemo-on-primary);
  --button-ink: var(--nemo-on-primary);
  --black: var(--nemo-primary);
  --white: var(--nemo-on-primary);
  --inverse: var(--nemo-primary);
  --inverse-text: var(--nemo-on-primary);
  --primary: var(--nemo-primary);
  --primary-text: var(--nemo-on-primary);
  --pill-active: var(--nemo-primary);
  --pill-active-text: var(--nemo-on-primary);
  --toggle: var(--nemo-primary);
  --toggle-knob: var(--nemo-on-primary);
  --nav-bg: var(--nemo-nav);
  --overlay: var(--nemo-scrim);
  --scrim: var(--nemo-scrim);
  --shadow-small: var(--nemo-shadow-soft);
  --focus: var(--nemo-line-strong);
  --ring: var(--nemo-line-strong);
  --success: var(--nemo-text-2);
  --unread: var(--nemo-track);
  --selected: var(--nemo-primary);
  --good: var(--nemo-text-2);
  --avatar-a: var(--nemo-surface-strong);
  --avatar-b: var(--nemo-surface-soft);
  --avatar-1: var(--nemo-surface-strong);
  --avatar-2: var(--nemo-surface);
  --avatar-3: var(--nemo-surface-soft);
  --avatar-4: var(--nemo-track);
  --orb: var(--nemo-surface-strong);
  --orb1: var(--nemo-surface-strong);
  --orb2: var(--nemo-surface);
}

/* --------------------------------------------------------------------------
   Base helpers shared by every reference.
   -------------------------------------------------------------------------- */
.nemo-screen {
  width: 100%;
  max-width: 430px;
  min-height: 100dvh;
  padding-bottom: calc(28px + env(safe-area-inset-bottom));
  background: var(--nemo-bg);
  color: var(--nemo-text);
  font-family: var(--nemo-font);
  overflow: hidden;
  isolation: isolate;
}

.nemo-glass {
  position: relative;
  overflow: hidden;
  border: 1px solid var(--nemo-line);
  border-radius: var(--nemo-radius-card);
  background: var(--nemo-surface);
  box-shadow: var(--nemo-inner-highlight), var(--nemo-shadow-soft);
  -webkit-backdrop-filter: blur(var(--nemo-blur)) saturate(115%);
  backdrop-filter: blur(var(--nemo-blur)) saturate(115%);
}

.nemo-glass::after {
  content: "";
  position: absolute;
  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.42), transparent 42%, rgba(255, 255, 255, 0.06));
  opacity: 0.75;
}

.nemo-primary-button {
  height: var(--nemo-control-h);
  border: 0;
  border-radius: var(--nemo-radius-control);
  background: var(--nemo-primary);
  color: var(--nemo-on-primary);
  font-size: var(--nemo-card);
  font-weight: 700;
  box-shadow: var(--nemo-shadow-soft);
  transition: transform var(--nemo-tap) var(--nemo-ease-out);
}

.nemo-primary-button:active { transform: scale(0.985); }
.nemo-primary-button:disabled { opacity: 0.42; pointer-events: none; }

.nemo-nav {
  position: fixed;
  z-index: 20;
  left: 50%;
  bottom: calc(12px + env(safe-area-inset-bottom));
  width: min(390px, calc(100% - 36px));
  height: 66px;
  padding: 6px 8px;
  transform: translateX(-50%);
  display: flex;
  align-items: center;
  justify-content: space-around;
  border: 1px solid var(--nemo-line-strong);
  border-radius: 24px;
  background: var(--nemo-nav);
  box-shadow: var(--nemo-shadow-nav);
  -webkit-backdrop-filter: blur(28px) saturate(135%);
  backdrop-filter: blur(28px) saturate(135%);
}

.nemo-nav-item {
  flex: 1;
  height: 52px;
  border: 0;
  border-radius: 18px;
  background: transparent;
  color: var(--nemo-text-2);
  font-size: var(--nemo-micro);
  font-weight: 650;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
}

.nemo-nav-item.active {
  background: var(--nemo-primary);
  color: var(--nemo-on-primary);
}

/* Self-contained light/dark switch used by references that predate the
   data-theme switcher. It only flips <html data-theme>. */
.nemo-theme-toggle {
  position: fixed;
  z-index: 40;
  top: calc(14px + env(safe-area-inset-top));
  right: 16px;
  width: 42px;
  height: 42px;
  display: grid;
  place-items: center;
  border: 1px solid var(--nemo-line-strong);
  border-radius: 15px;
  background: var(--nemo-surface);
  color: var(--nemo-text);
  box-shadow: var(--nemo-inner-highlight), var(--nemo-shadow-soft);
  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  touch-action: manipulation;
  transition: transform var(--nemo-tap) var(--nemo-ease-out);
}

.nemo-theme-toggle:active { transform: scale(0.94); }
.nemo-theme-toggle svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.nemo-theme-toggle .nemo-icon-sun { display: none; }
[data-theme="dark"] .nemo-theme-toggle .nemo-icon-sun { display: block; }
[data-theme="dark"] .nemo-theme-toggle .nemo-icon-moon { display: none; }

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
<!-- NEMO-TOKENS:END -->
</head>
<body>
<main class="app" id="app" data-theme="light">
  <div class="ambient one"></div><div class="ambient two"></div><div class="grain"></div>
  <section class="screen" aria-label="Nemo sign in">
    <header class="topbar">
      <div class="brand" aria-label="Nemo">
        <span class="brand-mark" aria-hidden="true"></span>
        <span class="brand-name">nemo</span>
      </div>
      <button class="theme-toggle" id="themeToggle" type="button" aria-label="Switch to dark appearance" title="Change appearance">
        <svg id="themeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M20.4 15.1A8.5 8.5 0 0 1 8.9 3.6 8.6 8.6 0 1 0 20.4 15.1Z"/></svg>
      </button>
    </header>

    <div class="content" id="content">
      <div class="intro">
        <div class="eyebrow">YOUR SPACE, YOUR PEOPLE</div>
        <h1 id="heroTitle">Good to<br>have you back.</h1>
        <p class="intro-copy" id="heroCopy">A quieter place for the conversations that matter.</p>
      </div>

      <div class="glass-shell">
        <div class="glass-card" id="glassCard">
          <div class="card-heading">
            <h2 id="formTitle">Welcome back</h2>
            <p id="formSubtitle">Sign in to continue to Nemo.</p>
          </div>
          <form id="authForm" novalidate>
            <label class="field signup-extra" for="displayName">
              <span class="field-label">Display name</span>
              <div class="input-wrap"><input id="displayName" name="displayName" type="text" placeholder="What should people call you?" autocomplete="nickname"><svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.7-3.2 3-4.8 6.5-4.8s5.8 1.6 6.5 4.8"/></svg></div>
            </label>
            <label class="field" for="username">
              <span class="field-label">Username</span>
              <div class="input-wrap"><input id="username" name="username" type="text" placeholder="Enter your username" autocomplete="username" autocapitalize="none" required><svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="8" r="3.2"/><path d="M5.5 20c.7-3.2 3-4.8 6.5-4.8s5.8 1.6 6.5 4.8"/></svg></div>
            </label>
            <label class="field" for="password">
              <span class="field-label">Password</span>
              <div class="input-wrap"><input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required><button class="password-toggle" id="passwordToggle" type="button" aria-label="Show password"><svg id="eyeIcon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg></button></div>
            </label>
            <label class="field signup-extra" for="confirmPassword">
              <span class="field-label">Confirm password</span>
              <div class="input-wrap"><input id="confirmPassword" name="confirmPassword" type="password" placeholder="Enter your password again" autocomplete="new-password"><svg class="input-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="10" width="16" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg></div>
            </label>
            <div class="form-meta login-only">
              <label class="remember"><input type="checkbox" id="remember"><span>Remember me</span></label>
              <button class="text-button" type="button" id="helpButton">Need help?</button>
            </div>
            <label class="remember signup-extra" style="margin:2px 1px 17px;align-items:flex-start;line-height:1.5"><input type="checkbox" id="terms" style="margin-top:1px"><span>I agree to the Terms of Service and Privacy Policy.</span></label>
            <button class="primary-button" type="submit" id="submitButton"><span id="submitLabel">Sign in</span><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg></button>
          </form>
          <div class="switch-row" id="switchRow"><span>New to Nemo?</span><button type="button" id="switchButton">Create an account</button></div>
          <div class="divider"></div>
          <div class="secure-note"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><rect x="4.5" y="10" width="15" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span>Your conversations belong to you.</span></div>
        </div>
      </div>
    </div>
    <footer class="footer"><span>Made for your people</span><span class="dot"></span><span>© Nemo</span></footer>
  </section>
</main>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
  const app = document.getElementById('app');
  const content = document.getElementById('content');
  const authForm = document.getElementById('authForm');
  const password = document.getElementById('password');
  const toast = document.getElementById('toast');
  let isSignup = false;
  let toastTimer;
  function showToast(message) {
    toast.textContent = message;
    toast.classList.add('show');
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => toast.classList.remove('show'), 2400);
  }
  function setMode(signup) {
    isSignup = signup;
    app.classList.toggle('signup', signup);
    document.body.classList.toggle('signup', signup);
    document.getElementById('heroTitle').innerHTML = signup ? 'Make room<br>for your people.' : 'Good to<br>have you back.';
    document.getElementById('heroCopy').textContent = signup ? 'Create your space. The good conversations start here.' : 'A quieter place for the conversations that matter.';
    document.getElementById('formTitle').textContent = signup ? 'Create your account' : 'Welcome back';
    document.getElementById('formSubtitle').textContent = signup ? 'A few details and you’re all set.' : 'Sign in to continue to Nemo.';
    document.getElementById('submitLabel').textContent = signup ? 'Create account' : 'Sign in';
    document.getElementById('switchRow').querySelector('span').textContent = signup ? 'Already have an account?' : 'New to Nemo?';
    document.getElementById('switchButton').textContent = signup ? 'Sign in' : 'Create an account';
    document.getElementById('password').autocomplete = signup ? 'new-password' : 'current-password';
    document.getElementById('displayName').required = signup;
    document.getElementById('confirmPassword').required = signup;
    document.getElementById('terms').required = signup;
    document.getElementById('remember').checked = false;
    password.value = '';
    document.getElementById('username').value = '';
    document.getElementById('displayName').value = '';
    document.getElementById('confirmPassword').value = '';
    content.classList.remove('mode-enter');
    void content.offsetWidth;
    content.classList.add('mode-enter');
  }
  document.getElementById('switchButton').addEventListener('click', () => setMode(!isSignup));
  document.getElementById('passwordToggle').addEventListener('click', () => {
    const reveal = password.type === 'password';
    password.type = reveal ? 'text' : 'password';
    document.getElementById('passwordToggle').setAttribute('aria-label', reveal ? 'Hide password' : 'Show password');
    document.getElementById('eyeIcon').innerHTML = reveal
      ? '<path d="M3 3l18 18M10.6 10.7a2 2 0 0 0 2.7 2.7"/><path d="M9.9 5.2A10.8 10.8 0 0 1 12 5c6.1 0 9.5 7 9.5 7a16 16 0 0 1-3.1 3.8M6.2 6.3C3.8 8 2.5 12 2.5 12s3.4 7 9.5 7a9.6 9.6 0 0 0 3.2-.6"/>'
      : '<path d="M2.5 12s3.4-6 9.5-6 9.5 6 9.5 6-3.4 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/>';
  });
  document.getElementById('themeToggle').addEventListener('click', () => {
    const dark = app.dataset.theme !== 'dark';
    app.dataset.theme = dark ? 'dark' : 'light';
    document.querySelector('meta[name="theme-color"]').content = dark ? '#111111' : '#f2f2f1';
    document.getElementById('themeToggle').setAttribute('aria-label', dark ? 'Switch to light appearance' : 'Switch to dark appearance');
    document.getElementById('themeIcon').innerHTML = dark
      ? '<circle cx="12" cy="12" r="3.8"/><path d="M12 2v2m0 16v2M4.93 4.93l1.42 1.42m11.3 11.3 1.42 1.42M2 12h2m16 0h2M4.93 19.07l1.42-1.42m11.3-11.3 1.42-1.42"/>'
      : '<path d="M20.4 15.1A8.5 8.5 0 0 1 8.9 3.6 8.6 8.6 0 1 0 20.4 15.1Z"/>';
  });
  document.getElementById('helpButton').addEventListener('click', () => showToast('Account recovery will be available in a future version.'));
  authForm.addEventListener('submit', (event) => {
    event.preventDefault();
    if (!authForm.reportValidity()) return;
    if (isSignup) {
      if (password.value !== document.getElementById('confirmPassword').value) {
        showToast('Your passwords do not match.'); return;
      }
      if (!document.getElementById('terms').checked) {
        showToast('Please accept the terms to continue.'); return;
      }
      showToast('Preview only — account creation is not connected yet.');
    } else {
      showToast('Preview only — sign-in is not connected yet.');
    }
  });
  // Mobile-first interaction: no cursor tracking or mouse-following glow.
  // A finger tap creates a short-lived local reflection and ripple on the glass.
  const card = document.getElementById('glassCard');
  let touchLightTimer;
  card.addEventListener('pointerdown', (event) => {
    if (event.pointerType !== 'touch' && event.pointerType !== 'pen') return;
    const rect = card.getBoundingClientRect();
    const x = Math.max(0, Math.min(100, ((event.clientX - rect.left) / rect.width) * 100));
    const y = Math.max(0, Math.min(100, ((event.clientY - rect.top) / rect.height) * 100));
    card.style.setProperty('--touch-x', `${x}%`);
    card.style.setProperty('--touch-y', `${y}%`);
    card.classList.add('touch-lit');
    clearTimeout(touchLightTimer);
    touchLightTimer = setTimeout(() => card.classList.remove('touch-lit'), 620);

    const ripple = document.createElement('span');
    ripple.className = 'touch-ripple';
    ripple.style.setProperty('--tap-x', `${event.clientX - rect.left}px`);
    ripple.style.setProperty('--tap-y', `${event.clientY - rect.top}px`);
    card.appendChild(ripple);
    ripple.addEventListener('animationend', () => ripple.remove(), { once: true });
  }, { passive: true });
  card.addEventListener('pointerup', (event) => {
    if (event.pointerType === 'touch' || event.pointerType === 'pen') {
      clearTimeout(touchLightTimer);
      touchLightTimer = setTimeout(() => card.classList.remove('touch-lit'), 240);
    }
  }, { passive: true });
  card.addEventListener('pointercancel', () => card.classList.remove('touch-lit'), { passive: true });
</script>
</body>
</html>
