<title>Nemo — Create account</title>
<style>
:root{
  color-scheme:light;
  --ink:#171719; --muted:#77777d; --soft:#a4a4aa;
  --surface:rgba(255,255,255,.58); --surface-strong:rgba(255,255,255,.78);
  --line:rgba(255,255,255,.88); --line-soft:rgba(35,35,40,.075);
  --shadow:0 18px 48px rgba(20,20,25,.075),inset 0 1px 0 rgba(255,255,255,.96);
  --field:rgba(255,255,255,.56); --field-focus:rgba(255,255,255,.91);
  --button:#19191c; --button-text:#fff;
  --radius:25px;
}
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;color:var(--ink)}
body{
  min-height:100svh; overflow-x:hidden;
  background:
    radial-gradient(ellipse at 18% 8%,var(--glass2) 0,rgba(255,255,255,0) 37%),
    radial-gradient(ellipse at 88% 35%,var(--glass) 0,rgba(255,255,255,0) 34%),
    radial-gradient(ellipse at 50% 105%,var(--bg2) 0,rgba(190,190,195,0) 45%),
    linear-gradient(145deg,var(--bg2),var(--bg) 48%,var(--bg2));
}
body:before,body:after{content:"";position:fixed;pointer-events:none;border-radius:50%;filter:blur(2px);opacity:.55;z-index:-1}
body:before{width:280px;height:280px;top:20%;left:-210px;background:radial-gradient(circle at 60% 35%,var(--glass2) 0,var(--glass) 45%,transparent 72%);animation:ambientA 13s ease-in-out infinite alternate}
body:after{width:330px;height:330px;right:-230px;bottom:8%;background:radial-gradient(circle at 40% 40%,var(--glass2),var(--glass) 55%,transparent 73%);animation:ambientB 17s ease-in-out infinite alternate}
button,input{font:inherit}button{color:inherit}
.app{width:min(100%,460px);min-height:100svh;margin:0 auto;padding:env(safe-area-inset-top) 22px env(safe-area-inset-bottom);display:flex;flex-direction:column;position:relative}
.topbar{height:62px;display:flex;align-items:center;justify-content:space-between;flex-shrink:0}
.icon-button{width:42px;height:42px;border:1px solid var(--line);border-radius:50%;display:grid;place-items:center;background:var(--glass);color:var(--ink);box-shadow:var(--shadow-soft),inset 0 1px 0 var(--glass-hi);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);touch-action:manipulation;transition:transform .18s ease,background .18s ease}
.icon-button:active{transform:scale(.93);background:var(--glass2)}
.icon-button .sun{display:none}
[data-theme="dark"] .icon-button .sun{display:block}
[data-theme="dark"] .icon-button .moon{display:none}
.step{font-size:11px;letter-spacing:.13em;font-weight:650;color:var(--muted)}
.content{width:100%;max-width:390px;margin:0 auto;flex:1;display:flex;flex-direction:column;justify-content:center;padding:8px 0 26px;animation:enter .72s cubic-bezier(.2,.75,.25,1) both}
.intro{text-align:center;margin:0 0 28px}
.avatar-wrap{width:74px;height:74px;margin:0 auto 17px;position:relative;animation:avatarFloat 5s ease-in-out infinite}
.avatar-glass{width:74px;height:74px;border-radius:50%;display:grid;place-items:center;color:var(--muted);background:linear-gradient(145deg,var(--glass2),var(--glass));border:1px solid var(--line);box-shadow:0 12px 28px rgba(22,22,26,.09),inset 0 1px 0 var(--glass-hi),inset 0 -7px 15px rgba(80,80,85,.07);backdrop-filter:blur(18px);-webkit-backdrop-filter:blur(18px);overflow:hidden}
.avatar-glass:before{content:"";position:absolute;inset:1px 1px auto;height:35%;border-radius:100px 100px 45% 45%;background:linear-gradient(180deg,var(--glass-hi),rgba(255,255,255,0));pointer-events:none}
.avatar-glass svg{width:38px;height:38px;opacity:.76}
.avatar-orbit{position:absolute;width:14px;height:14px;right:-1px;bottom:2px;border-radius:50%;background:linear-gradient(145deg,var(--glass2),var(--glass));border:2px solid var(--line);box-shadow:0 3px 9px rgba(0,0,0,.11)}
.eyebrow{font-size:10px;letter-spacing:.17em;font-weight:700;color:var(--muted);margin-bottom:8px}
h1{font-size:29px;line-height:1.1;letter-spacing:-.045em;font-weight:720;margin:0 0 8px}
.subtitle{font-size:13px;line-height:1.5;color:var(--muted);margin:0}
.form-card{padding:8px;border-radius:31px;background:linear-gradient(145deg,var(--glass2),var(--glass));border:1px solid var(--line);box-shadow:var(--shadow);backdrop-filter:blur(30px) saturate(115%);-webkit-backdrop-filter:blur(30px) saturate(115%);position:relative;overflow:hidden}
.form-card:before{content:"";position:absolute;left:18px;right:18px;top:1px;height:1px;background:linear-gradient(90deg,transparent,var(--glass-hi),transparent)}
.field{height:58px;display:flex;align-items:center;gap:13px;padding:0 15px;margin:5px 0;border-radius:19px;background:var(--field);border:1px solid var(--line);box-shadow:inset 0 1px 3px rgba(40,40,45,.025),0 2px 8px rgba(30,30,35,.018);transition:background .22s ease,border-color .22s ease,box-shadow .22s ease;position:relative}
.field:focus-within{background:var(--field-focus);border-color:var(--line-strong);box-shadow:0 0 0 3px var(--line),inset 0 1px 2px rgba(0,0,0,.025)}
.field-icon{width:24px;height:24px;flex:0 0 24px;display:grid;place-items:center;color:var(--muted)}
.field-icon svg{width:19px;height:19px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.field-copy{min-width:0;flex:1;display:flex;flex-direction:column;gap:2px}
.field label{font-size:10px;line-height:1;color:var(--muted);font-weight:600;letter-spacing:.015em}
.field input{width:100%;min-width:0;border:0;outline:0;background:transparent;color:var(--ink);font-size:14px;line-height:1.2;padding:0}
.field input::placeholder{color:var(--subtle);opacity:1}
.visibility{border:0;background:transparent;color:var(--muted);width:34px;height:34px;border-radius:50%;display:grid;place-items:center;touch-action:manipulation}
.visibility:active{background:var(--soft)}
.visibility svg{width:18px;height:18px;stroke:currentColor;fill:none;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.strength{padding:11px 12px 9px;margin:4px 4px 2px;display:flex;align-items:center;justify-content:space-between;gap:12px}
.strength-label{font-size:10px;color:var(--muted);font-weight:600}
.strength-value{font-size:10px;color:var(--ink);font-weight:650}
.strength-bars{display:flex;gap:4px;margin-top:7px}
.strength-bars span{height:4px;flex:1;border-radius:5px;background:var(--line-strong);transition:background .2s ease}
.strength-bars span.on{background:var(--ink)}
.strength-copy{font-size:10px;color:var(--subtle);text-align:right;margin-top:5px}
.submit{position:relative;width:100%;height:56px;margin-top:14px;border:1px solid var(--line);border-radius:19px;background:var(--button);color:var(--button-text);font-size:14px;font-weight:650;letter-spacing:.005em;box-shadow:var(--shadow-soft);overflow:hidden;touch-action:manipulation;transition:transform .18s ease,filter .18s ease,box-shadow .18s ease}
.submit:before{content:"";position:absolute;inset:1px 1px auto;height:45%;border-radius:18px 18px 50% 50%;background:linear-gradient(180deg,rgba(255,255,255,.18),transparent);pointer-events:none}
.submit:active{transform:scale(.975);filter:brightness(1.08);box-shadow:0 4px 10px rgba(0,0,0,.14),inset 0 1px 0 rgba(255,255,255,.2)}
.submit span{position:relative;z-index:1}
.footer{text-align:center;padding:19px 0 7px;color:var(--muted);font-size:12px}
.footer button{border:0;background:transparent;font-weight:700;color:var(--ink);padding:8px 5px;touch-action:manipulation}
.footer button:active{opacity:.55}
.note{text-align:center;font-size:10px;line-height:1.5;color:var(--subtle);padding:4px 20px 12px}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom));transform:translate(-50%,18px);opacity:0;pointer-events:none;max-width:calc(100vw - 40px);padding:12px 16px;border-radius:16px;background:var(--button);color:var(--button-text);font-size:12px;box-shadow:0 10px 30px rgba(0,0,0,.18);transition:opacity .25s ease,transform .25s ease;z-index:10;text-align:center;backdrop-filter:blur(18px)}
.toast.show{opacity:1;transform:translate(-50%,0)}
.ripple{position:absolute;border-radius:50%;background:rgba(255,255,255,.24);transform:scale(0);animation:ripple .56s ease-out forwards;pointer-events:none}
@keyframes enter{from{opacity:0;transform:translateY(16px)}to{opacity:1;transform:translateY(0)}}
@keyframes avatarFloat{0%,100%{transform:translateY(0)}50%{transform:translateY(-4px)}}
@keyframes ambientA{from{transform:translate3d(0,0,0) scale(.95)}to{transform:translate3d(25px,18px,0) scale(1.08)}}
@keyframes ambientB{from{transform:translate3d(0,0,0) scale(1)}to{transform:translate3d(-20px,-24px,0) scale(1.1)}}
@keyframes ripple{to{transform:scale(3.2);opacity:0}}
@media(max-height:760px){.content{padding:0 0 10px}.intro{margin-bottom:17px}.avatar-wrap,.avatar-glass{width:62px;height:62px}.avatar-wrap{margin-bottom:12px}.avatar-glass svg{width:32px;height:32px}h1{font-size:26px}.field{height:54px}.submit{height:52px;margin-top:10px}.footer{padding-top:11px}}
@media(min-width:600px){body{display:grid;place-items:center;padding:24px 0}.app{min-height:min(900px,calc(100svh - 48px));height:min(900px,calc(100svh - 48px));border-radius:38px;overflow:hidden;box-shadow:var(--shadow);border:1px solid var(--line);background:var(--surface-soft)}}
@media(prefers-reduced-motion:reduce){*,*:before,*:after{animation-duration:.01ms!important;animation-iteration-count:1!important;scroll-behavior:auto!important;transition-duration:.01ms!important}}
</style>

  box-shadow: var(--nemo-inner-highlight), var(--nemo-shadow-soft);

.nemo-glass::after {
  content: "";

  inset: 0;
  pointer-events: none;
  border-radius: inherit;
  background: linear-gradient(145deg, rgba(255, 255, 255, 0.42), transparent 42%, rgba(255, 255, 255, 0.06));
  opacity: 0.75;

  -webkit-backdrop-filter: blur(18px);
  backdrop-filter: blur(18px);
  touch-action: manipulation;
  transition: transform var(--nemo-tap) var(--nemo-ease-out);
}

.nemo-theme-toggle:active { transform: scale(0.94); }
.nemo-theme-toggle svg {
  width: 19px;
  height: 19px;
  fill: none;
  stroke: currentColor;
  stroke-width: 1.8;
  stroke-linecap: round;
  stroke-linejoin: round;
}
.nemo-theme-toggle .nemo-icon-sun { display: none; }
[data-theme="dark"] .nemo-theme-toggle .nemo-icon-sun { display: block; }
[data-theme="dark"] .nemo-theme-toggle .nemo-icon-moon { display: none; }

@media (prefers-reduced-motion: reduce) {
  *,
  *::before,
  *::after {
    animation-duration: 0.01ms !important;
    animation-iteration-count: 1 !important;
    transition-duration: 0.01ms !important;
  }
}
</style>
<!-- NEMO-TOKENS:END -->
</head>
<body>
<div class="app">
  <header class="topbar">
    <button class="icon-button" type="button" aria-label="Go back" id="backBtn">
      <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="m15 18-6-6 6-6"/></svg>
    </button>
    <div class="step">ACCOUNT SETUP&nbsp;&nbsp; / &nbsp;&nbsp;01</div>
    <button class="icon-button" type="button" id="themeToggle" aria-label="Switch to dark mode">
      <svg class="moon" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M20.5 14A8.5 8.5 0 0 1 10 3.5 8.5 8.5 0 1 0 20.5 14Z"/></svg>
      <svg class="sun" width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2.5v2M12 19.5v2M2.5 12h2M19.5 12h2M5.3 5.3l1.4 1.4M17.3 17.3l1.4 1.4M18.7 5.3l-1.4 1.4M6.7 17.3l-1.4 1.4"/></svg>
    </button>
  </header>

  <main class="content">
    <section class="intro">
      <div class="avatar-wrap" aria-hidden="true">
        <div class="avatar-glass">
          <svg viewBox="0 0 48 48" fill="none" aria-hidden="true">
            <circle cx="24" cy="16" r="9" fill="currentColor" opacity=".72"/>
            <path d="M8 42c1.6-9.2 7.3-14 16-14s14.4 4.8 16 14" fill="currentColor" opacity=".72"/>
          </svg>
        </div>
        <span class="avatar-orbit"></span>
      </div>
      <div class="eyebrow">WELCOME TO NEMO</div>
      <h1>Create Account</h1>
      <p class="subtitle">A little space for your favourite conversations.</p>
    </section>

    <form class="form-card" id="signupForm" novalidate>
      <div class="field">
        <span class="field-icon"><svg viewBox="0 0 24 24"><circle cx="12" cy="8" r="3.5"/><path d="M5 20c.8-3.6 3.1-5.5 7-5.5s6.2 1.9 7 5.5"/></svg></span>
        <div class="field-copy"><label for="displayName">NAME SHOWN TO FRIENDS</label><input id="displayName" name="displayName" autocomplete="name" placeholder="e.g. Alex" maxlength="32" required></div>
      </div>
      <div class="field">
        <span class="field-icon"><svg viewBox="0 0 24 24"><circle cx="8.5" cy="8" r="3.5"/><path d="M2.5 20c.7-3.4 2.7-5 6-5 1.5 0 2.8.4 3.8 1.1M15 7h6M18 4v6M15 16h6M15 20h6"/></svg></span>
        <div class="field-copy"><label for="username">USERNAME</label><input id="username" name="username" autocomplete="username" autocapitalize="none" spellcheck="false" placeholder="@username" minlength="3" maxlength="20" required></div>
      </div>
      <div class="field">
        <span class="field-icon"><svg viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></span>
        <div class="field-copy"><label for="password">PASSWORD</label><input id="password" name="password" type="password" autocomplete="new-password" placeholder="Create a password" minlength="8" required></div>
        <button class="visibility" type="button" data-toggle="password" aria-label="Show password"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg></button>
      </div>
      <div class="field">
        <span class="field-icon"><svg viewBox="0 0 24 24"><rect x="4.5" y="10" width="15" height="11" rx="2.5"/><path d="M8 10V7a4 4 0 0 1 8 0v3M12 14v3"/></svg></span>
        <div class="field-copy"><label for="confirmPassword">CONFIRM PASSWORD</label><input id="confirmPassword" name="confirmPassword" type="password" autocomplete="new-password" placeholder="Enter it again" required></div>
        <button class="visibility" type="button" data-toggle="confirmPassword" aria-label="Show confirm password"><svg viewBox="0 0 24 24"><path d="M2.5 12s3.3-6 9.5-6 9.5 6 9.5 6-3.3 6-9.5 6-9.5-6-9.5-6Z"/><circle cx="12" cy="12" r="2.7"/></svg></button>
      </div>
      <div class="strength" aria-live="polite">
        <div style="flex:1;min-width:0"><div class="strength-label">PASSWORD STRENGTH</div><div class="strength-bars" id="strengthBars"><span></span><span></span><span></span><span></span></div></div>
        <div><div class="strength-value" id="strengthValue">Not entered</div><div class="strength-copy" id="matchText">Use at least 8 characters</div></div>
      </div>
      <button class="submit" type="submit"><span>Create Account</span></button>
    </form>

    <div class="footer">Already have an account? <button type="button" id="loginBtn">Log in</button></div>
    <div class="note">Your account will have its own recovery codes. Keep them somewhere safe.</div>
  </main>
</div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<script>
const $ = s => document.querySelector(s);
const toast = $('#toast'); let toastTimer;
function showToast(message){toast.textContent=message;toast.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>toast.classList.remove('show'),2400)}
function strengthOf(value){let n=0;if(value.length>=8)n++;if(value.length>=12)n++;if(/[A-Z]/.test(value)&&/[a-z]/.test(value))n++;if(/[0-9]/.test(value))n++;if(/[^A-Za-z0-9]/.test(value))n++;return Math.min(4,n)}
$('#password').addEventListener('input',e=>{const v=e.target.value;const n=strengthOf(v);const labels=['Not entered','Weak','Fair','Good','Strong'];$('#strengthValue').textContent=v?labels[n]:'Not entered';[...$('#strengthBars').children].forEach((bar,i)=>bar.classList.toggle('on',i<n));updateMatch()});
$('#confirmPassword').addEventListener('input',updateMatch);
function updateMatch(){const p=$('#password').value,c=$('#confirmPassword').value;$('#matchText').textContent=!c?'Use at least 8 characters':p===c?'Passwords match':'Passwords do not match'}
document.querySelectorAll('[data-toggle]').forEach(btn=>btn.addEventListener('click',()=>{const input=document.getElementById(btn.dataset.toggle);input.type=input.type==='password'?'text':'password';btn.setAttribute('aria-label',input.type==='password'?'Show password':'Hide password')}));
$('#signupForm').addEventListener('submit',e=>{e.preventDefault();const name=$('#displayName').value.trim(),user=$('#username').value.trim(),pass=$('#password').value,confirm=$('#confirmPassword').value;if(!name||!user||!pass||!confirm){showToast('Please complete all fields.');return}if(!/^[a-zA-Z0-9_]{3,20}$/.test(user)){showToast('Use 3–20 letters, numbers or underscores for your username.');$('#username').focus();return}if(pass.length<8){showToast('Your password needs at least 8 characters.');$('#password').focus();return}if(pass!==confirm){showToast('Your passwords do not match.');$('#confirmPassword').focus();return}showToast('Preview only — account creation will be connected later.')});
$('#loginBtn').addEventListener('click',()=>showToast('Login screen is already implemented in Nemo.'));
$('#backBtn').addEventListener('click',()=>showToast('Back to the Nemo welcome screen.'));
// Light / dark appearance toggle (shared monochrome tokens).
const root=document.documentElement,themeToggle=document.getElementById('themeToggle');
function setTheme(theme){root.dataset.theme=theme;themeToggle.setAttribute('aria-label',theme==='dark'?'Switch to light mode':'Switch to dark mode')}
themeToggle.addEventListener('click',()=>setTheme(root.dataset.theme==='light'?'dark':'light'));
// Touch ripples are local to the pressed element; no cursor or mouse-following effects.
document.querySelectorAll('button').forEach(button=>button.addEventListener('touchstart',e=>{const touch=e.changedTouches[0],rect=button.getBoundingClientRect(),r=document.createElement('span');r.className='ripple';const size=Math.max(rect.width,rect.height)*.35;r.style.width=r.style.height=size+'px';r.style.left=(touch.clientX-rect.left-size/2)+'px';r.style.top=(touch.clientY-rect.top-size/2)+'px';button.appendChild(r);setTimeout(()=>r.remove(),650);},{passive:true}));
</script>
</body>
</html>
